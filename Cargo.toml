[package]
name = "setoff-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic multilateral netting: obligations in, net positions and a minimal settlement plan out."
keywords = ["netting", "clearing", "settlement", "stellar", "payments"]
categories = ["finance", "algorithms"]
license = "Apache-2.0"
repository = "https://github.com/SetOff-Org/setoff-engine"
homepage = "https://github.com/SetOff-Org"
authors = ["SetOff"]

[workspace]
members = [".", "bindings/wasm"]

[features]
default = ["std"]
# Disable for no_std + alloc targets (Soroban contracts, zkVMs, wasm32v1-none).
std = ["serde/std", "thiserror/std"]
# read_csv(): obligations from the CSV format `setoff net` uses.
csv = ["std", "dep:csv"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }
csv = { version = "1.4", optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "net"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
