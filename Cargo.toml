[package]
name = "setoff-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic multilateral netting: obligations in, net positions and a minimal settlement plan out."
keywords = ["netting", "clearing", "settlement", "stellar", "payments"]
categories = ["finance", "algorithms"]
license = "Apache-2.0"
repository = "https://github.com/SetOff-Org/setoff-engine"
homepage = "https://github.com/SetOff-Org"
authors = ["SetOff"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
